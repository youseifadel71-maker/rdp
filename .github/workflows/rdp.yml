name: Windows RDP via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Install Cloudflared
      run: |
        choco install cloudflared -y

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)

    - name: Start Tunnel & Show URL
      run: |
        Write-Host "Starting Cloudflare Tunnel..."
        $tunnel = Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -PassThru -WindowStyle Normal
        Start-Sleep -Seconds 15
        Write-Host "=================================================="
        Write-Host "Connection Info:"
        Write-Host "Username: runneradmin"
        Write-Host "Password: P@ssw0rd123!"
        Write-Host "=================================================="
        Write-Host "Check the logs above for the tunnel URL"
        Write-Host "(look for 'https://<random>.trycloudflare.com')"
        Write-Host "=================================================="
        Wait-Process -Id $tunnel.Id

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
