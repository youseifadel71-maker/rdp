name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Download Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/b4Pvu3qaWcd/ngrok-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .

      - name: 2. Authenticate Ngrok
        run: |
          .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: 3. Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "${{ secrets.RDP_PASSWORD }}" -Force)

      - name: 4. Start Tunnel
        run: |
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 5

      - name: 5. Display Connection Information
        run: |
          $response = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels
          $publicUrl = $response.tunnels[0].public_url
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "         RDP SERVER READY TO CONNECT              " -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Address:  $publicUrl" -ForegroundColor Cyan
          Write-Host "Username: runneradmin" -ForegroundColor Cyan
          Write-Host "Password: ${{ secrets.RDP_PASSWORD }}" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

      - name: 6. Keep Alive Loop
        run: |
          $i = 0
          while ($i -lt 360) {
              Start-Sleep -Seconds 60
              $i++
          }

