name: Windows RDP via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Install Cloudflared
      run: |
        choco install cloudflared -y

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin P@ssw0rd123!
        net localgroup administrators runneradmin /add

    - name: Start Cloudflare Tunnel
      id: tunnel
      run: |
        echo "Starting Cloudflare Tunnel..."
        Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -WindowStyle Hidden
        Start-Sleep -Seconds 20
        echo "Tunnel started. Check logs for URL."

    - name: Display Connection Info
      run: |
        Write-Host "=================================================="
        Write-Host "✅ RDP IS READY!"
        Write-Host "Username: runneradmin"
        Write-Host "Password: P@ssw0rd123!"
        Write-Host "=================================================="
        Write-Host "Look for the tunnel URL in the logs above."
        Write-Host "It will look like: https://xxxx.trycloudflare.com"
        Write-Host "=================================================="

    - name: Keep Alive
      run: |
        while ($true) { 
          Write-Host "Keep alive... (press Ctrl+C to stop)"
          Start-Sleep -Seconds 300
        }
