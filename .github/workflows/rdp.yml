name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Install Ngrok via Choco
        run: choco install ngrok -y

      - name: 2. Authenticate Ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: 3. Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "${{ secrets.RDP_PASSWORD }}" -Force)

      - name: 4. Start Tunnel & Record Logs
        run: |
          Start-Process -FilePath "ngrok.exe" -ArgumentList "tcp 3389 --log=ngrok.log" -WindowStyle Hidden
          Start-Sleep -Seconds 10
          
      - name: 5. Display Connection Information
        run: |
          try {
              $response = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -ErrorAction Stop
              $publicUrl = $response.tunnels[0].public_url
              Write-Host "==================================================" -ForegroundColor Green
              Write-Host "         RDP SERVER READY TO CONNECT              " -ForegroundColor Yellow
              Write-Host "==================================================" -ForegroundColor Green
              Write-Host "Address:  $publicUrl" -ForegroundColor Cyan
              Write-Host "Username: runneradmin" -ForegroundColor Cyan
              Write-Host "Password: ${{ secrets.RDP_PASSWORD }}" -ForegroundColor Cyan
              Write-Host "==================================================" -ForegroundColor Green
          } catch {
              Write-Host "حدث خطأ أثناء الاتصال! نقوم الآن بعرض سبب الرفض من Ngrok:" -ForegroundColor Red
              Write-Host "==================================================" -ForegroundColor Red
              Get-Content ngrok.log -Tail 15
              Write-Host "==================================================" -ForegroundColor Red
              exit 1
          }

      - name: 6. Keep Alive Loop
        run: |
          while ($true) {
              Start-Sleep -Seconds 60
          }
